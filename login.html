<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login | HansFX</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-950 h-screen flex items-center justify-center p-6 text-slate-200"
  >
    <div
      class="w-full max-w-sm bg-slate-900 p-8 rounded-xl border border-slate-800 text-center shadow-2xl"
    >
      <h1 class="text-2xl font-black mb-6 tracking-tighter text-blue-500">
        HANSFX LOGIN
      </h1>
      <input
        type="password"
        id="p"
        placeholder="Master Password"
        class="w-full bg-slate-950 p-4 rounded border border-slate-800 mb-4 text-center font-mono outline-none focus:border-blue-500"
      />
      <button
        onclick="lg()"
        class="w-full bg-blue-600 p-4 rounded font-black uppercase shadow-lg hover:bg-blue-700 transition-all"
      >
        Unlock System
      </button>
      <p class="mt-4 text-xs text-slate-500">Hint: Default password is 123</p>
    </div>

    <script>
      // Fungsi Login untuk GitHub Pages (Client-side)
      function lg() {
        const passInput = document.getElementById("p").value;

        // 1. Ambil data dari LocalStorage, jika belum ada gunakan default
        let db = JSON.parse(localStorage.getItem("hansfx_db"));

        if (!db) {
          // Data default jika user baru pertama kali buka web
          db = {
            profile: { name: "HansFX", password: "123" },
            trades: [],
            logs: [],
          };
          localStorage.setItem("hansfx_db", JSON.stringify(db));
        }

        // 2. Cek Password
        if (passInput === db.profile.password) {
          sessionStorage.setItem("isLoggedIn", "true");
          // Gunakan index.html sesuai struktur folder root kamu
          window.location.href = "index.html";
        } else {
          alert("Password Salah! Gunakan 123 untuk pertama kali.");
        }
      }

      // Memungkinkan tekan Enter untuk login
      document.getElementById("p").addEventListener("keypress", function (e) {
        if (e.key === "Enter") lg();
      });
    </script>
  </body>
</html>
