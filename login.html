<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login | HansFX</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-950 h-screen flex items-center justify-center p-6 text-slate-200"
  >
    <div
      class="w-full max-w-sm bg-slate-900 p-8 rounded-xl border border-slate-800 text-center shadow-2xl"
    >
      <h1 class="text-2xl font-black mb-6 tracking-tighter text-blue-500">
        HANSFX LOGIN
      </h1>
      <input
        type="password"
        id="p"
        placeholder="Master Password"
        class="w-full bg-slate-950 p-4 rounded border border-slate-800 mb-4 text-center font-mono outline-none focus:border-blue-500"
      />
      <button
        onclick="lg()"
        class="w-full bg-blue-600 p-4 rounded font-black uppercase shadow-lg"
      >
        Unlock System
      </button>
    </div>
    <script>
      async function lg() {
        const pass = document.getElementById("p").value;
        const res = await fetch("/api/data");
        const db = await res.json();
        if (pass === db.profile.password) {
          sessionStorage.setItem("isLoggedIn", "true");
          window.location.href = "index.html";
        } else {
          alert("Password Salah!");
        }
      }
    </script>
  </body>
</html>
