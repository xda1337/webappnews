<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login | HansFX</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-950 h-screen flex items-center justify-center p-6 text-slate-200"
  >
    <div
      class="w-full max-w-sm bg-slate-900 p-8 rounded-xl border border-slate-800 text-center shadow-2xl"
    >
      <h1 class="text-2xl font-black mb-6 tracking-tighter text-blue-500">
        HANSFX LOGIN
      </h1>
      <input
        type="password"
        id="p"
        placeholder="Master Password"
        class="w-full bg-slate-950 p-4 rounded border border-slate-800 mb-4 text-center font-mono outline-none focus:border-blue-500"
      />
      <button
        onclick="lg()"
        class="w-full bg-blue-600 p-4 rounded font-black uppercase shadow-lg hover:bg-blue-700 transition-all"
      >
        Unlock System
      </button>
    </div>

    <script>
      async function lg() {
        const passInput = document.getElementById("p").value;

        try {
          // Membaca file journal.json yang ada di root repository
          const res = await fetch("journal.json");

          if (!res.ok) throw new Error("Gagal mengambil data");

          const db = await res.json();

          // Mengambil password dari struktur: profile -> password
          if (passInput === db.profile.password) {
            sessionStorage.setItem("isLoggedIn", "true");
            window.location.href = "index.html";
          } else {
            alert("Password Salah!");
          }
        } catch (error) {
          console.error(error);
          alert("Error: File journal.json tidak ditemukan atau rusak.");
        }
      }

      // Fitur tambahan: Tekan Enter untuk login
      document.getElementById("p").addEventListener("keypress", (e) => {
        if (e.key === "Enter") lg();
      });
    </script>
  </body>
</html>
