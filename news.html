<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@700&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-color: transparent;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(51, 65, 85, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .news-btn {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(51, 65, 85, 0.5);
      }

      .news-btn.active {
        background: #2563eb;
        color: white;
        border-color: #3b82f6;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      }

      .shimmer-bg {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(37, 99, 235, 0.05),
          transparent
        );
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="p-2 md:p-4">
    <div class="max-w-[1600px] mx-auto space-y-6 pb-20 text-slate-200">
      <header
        class="flex flex-col md:flex-row gap-4 justify-between items-center glass-card p-6 rounded-[2rem] relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-600"></div>
        <div class="shimmer-bg absolute inset-0 pointer-events-none"></div>

        <div class="flex items-center gap-5 z-10">
          <div
            class="bg-blue-600/20 p-3 rounded-2xl border border-blue-500/30 shadow-lg shadow-blue-500/10"
          >
            <i class="fa fa-rss text-blue-500 text-xl animate-pulse"></i>
          </div>
          <div>
            <h2
              class="text-2xl font-black uppercase tracking-tighter text-white italic"
            >
              INTEL <span class="text-blue-500 font-normal">TERMINAL</span>
            </h2>
            <div class="flex items-center gap-2 mt-1">
              <span class="flex h-2 w-2">
                <span
                  class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-green-400 opacity-75"
                ></span>
                <span
                  class="relative inline-flex rounded-full h-2 w-2 bg-green-500"
                ></span>
              </span>
              <p
                class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]"
              >
                Global Live Feed <span class="text-slate-700 mx-1">/</span> Sync
                Stable
              </p>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-6 z-10">
          <div
            class="hidden xl:block border-l border-slate-800 pl-6 text-right"
          >
            <p
              class="text-[9px] text-slate-500 font-black uppercase tracking-widest mb-1"
            >
              Global Sentiment
            </p>
            <span class="text-xs font-black text-green-400"
              >NEUTRAL BULLISH</span
            >
          </div>
          <div
            class="bg-slate-950/80 p-3 px-5 rounded-2xl border border-slate-800 flex flex-col items-center min-w-[120px]"
          >
            <p
              class="text-[8px] text-blue-500 font-black uppercase tracking-widest"
            >
              Local Time
            </p>
            <p
              id="live-clock"
              class="text-lg font-mono font-bold text-blue-400 tabular-nums"
            >
              00:00:00
            </p>
          </div>
        </div>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-3 space-y-6">
          <div
            class="glass-card rounded-[2.5rem] flex flex-col h-[480px] overflow-hidden group"
          >
            <div
              class="p-5 border-b border-white/5 flex justify-between items-center bg-white/5"
            >
              <div class="flex items-center gap-2">
                <i class="fa fa-chart-pie text-blue-500 text-xs"></i>
                <p
                  class="text-[11px] font-black uppercase tracking-widest text-white"
                >
                  Market Watch
                </p>
              </div>
            </div>
            <div id="tv-screener" class="flex-grow"></div>
          </div>

          <div
            class="glass-card rounded-[2.5rem] flex flex-col h-[420px] overflow-hidden"
          >
            <div
              class="p-5 border-b border-white/5 flex justify-between items-center bg-white/5"
            >
              <div class="flex items-center gap-2">
                <i class="fa fa-calendar-alt text-red-500 text-xs"></i>
                <p
                  class="text-[11px] font-black uppercase tracking-widest text-white"
                >
                  Impact Events
                </p>
              </div>
              <span
                class="text-[9px] bg-red-600/10 text-red-500 px-2 py-0.5 rounded-full border border-red-500/20 font-black"
                >HIGH VOL</span
              >
            </div>
            <div id="tv-mini-calendar" class="flex-grow"></div>
          </div>
        </div>

        <div class="lg:col-span-6">
          <div
            class="glass-card rounded-[2.5rem] overflow-hidden h-[915px] shadow-2xl flex flex-col"
          >
            <div
              class="bg-slate-900/40 p-3 flex gap-2 justify-center border-b border-white/5 sticky top-0 z-20 backdrop-blur-md"
            >
              <button
                onclick="updateNews('all_symbols', this)"
                class="news-btn active px-6 py-2.5 text-[10px] font-black uppercase rounded-2xl transition-all flex items-center gap-2"
              >
                <i class="fa fa-bolt"></i> Headlines
              </button>
              <button
                onclick="updateNews('forex', this)"
                class="news-btn px-6 py-2.5 text-[10px] font-black uppercase rounded-2xl transition-all text-slate-400 hover:bg-white/5 hover:text-white flex items-center gap-2"
              >
                <i class="fa fa-dollar-sign"></i> Forex
              </button>
              <button
                onclick="updateNews('crypto', this)"
                class="news-btn px-6 py-2.5 text-[10px] font-black uppercase rounded-2xl transition-all text-slate-400 hover:bg-white/5 hover:text-white flex items-center gap-2"
              >
                <i class="fa fa-bitcoin"></i> Crypto
              </button>
            </div>
            <div id="tv-main-news" class="flex-grow"></div>
          </div>
        </div>

        <div class="lg:col-span-3 space-y-6">
          <div
            class="glass-card rounded-[2.5rem] flex flex-col h-[480px] overflow-hidden"
          >
            <div class="p-5 border-b border-white/5 bg-white/5">
              <p
                class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3"
              >
                Technical Gauge
              </p>
              <select
                id="gauge-selector"
                onchange="updateGauge(this.value)"
                class="w-full bg-slate-900 border border-slate-700/50 rounded-xl text-[11px] font-black uppercase p-3 text-blue-400 outline-none focus:border-blue-500 cursor-pointer"
              >
                <option value="OANDA:XAUUSD">GOLD (XAUUSD)</option>
                <option value="FX:EURUSD">EURUSD</option>
                <option value="FX:GBPUSD">GBPUSD</option>
                <option value="BINANCE:BTCUSDT">BITCOIN (BTC)</option>
                <option value="FX:USDJPY">USDJPY</option>
              </select>
            </div>
            <div id="tv-tech-gauge" class="flex-grow"></div>
          </div>

          <div class="glass-card rounded-[2.5rem] p-8 relative overflow-hidden">
            <h4
              class="text-xs font-black text-white uppercase mb-8 flex items-center gap-3"
            >
              <span
                class="p-2 bg-blue-500/10 rounded-xl border border-blue-500/20"
                ><i class="fa fa-fire text-blue-500"></i
              ></span>
              Relative Strength
            </h4>
            <div id="strength-meter" class="space-y-6"></div>
            <div class="mt-8 pt-6 border-t border-white/5">
              <div class="flex justify-between items-center opacity-40">
                <span class="text-[8px] font-black uppercase"
                  >Terminal Node: 0x24</span
                >
                <span class="text-[8px] font-mono">LATENCY: 12ms</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let clockInterval;

      function startClock() {
        if (clockInterval) clearInterval(clockInterval);
        const el = document.getElementById("live-clock");
        clockInterval = setInterval(() => {
          el.innerText = new Date().toLocaleTimeString("en-GB", {
            hour12: false,
          });
        }, 1000);
      }

      function loadWidget(id, src, config) {
        const container = document.getElementById(id);
        if (!container) return;
        container.innerHTML = "";
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.src = src;
        script.async = true;
        script.innerHTML = JSON.stringify(config);
        container.appendChild(script);
      }

      function updateNews(mode, btn) {
        loadWidget(
          "tv-main-news",
          "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js",
          {
            colorTheme: "dark",
            isTransparent: true,
            displayMode: "regular",
            width: "100%",
            height: "100%",
            locale: "id",
            feedMode: mode === "all_symbols" ? "all_symbols" : "market",
            market: mode !== "all_symbols" ? mode : undefined,
          },
        );

        if (btn) {
          document
            .querySelectorAll(".news-btn")
            .forEach((b) => b.classList.remove("active", "text-white"));
          btn.classList.add("active");
        }
      }

      function updateGauge(symbol) {
        loadWidget(
          "tv-tech-gauge",
          "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js",
          {
            interval: "1h",
            width: "100%",
            height: "100%",
            isTransparent: true,
            symbol: symbol,
            showIntervalTabs: true,
            locale: "id",
            colorTheme: "dark",
          },
        );
      }

      function renderStrength() {
        const data = [
          { name: "USD", val: 88, color: "bg-blue-500" },
          { name: "EUR", val: 42, color: "bg-indigo-400" },
          { name: "JPY", val: 15, color: "bg-red-500" },
          { name: "GBP", val: 65, color: "bg-emerald-500" },
        ];
        const container = document.getElementById("strength-meter");
        container.innerHTML = data
          .map(
            (c) => `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-[10px] font-black text-white tracking-widest">${c.name}</span>
              <span class="text-[9px] font-mono font-bold text-slate-400">${c.val}%</span>
            </div>
            <div class="w-full bg-slate-800/50 h-1.5 rounded-full overflow-hidden p-[1px]">
              <div class="${c.color} h-full rounded-full transition-all duration-[2000ms]" style="width: 0%" id="strength-${c.name}"></div>
            </div>
          </div>
        `,
          )
          .join("");
        setTimeout(
          () =>
            data.forEach(
              (c) =>
                (document.getElementById(`strength-${c.name}`).style.width =
                  c.val + "%"),
            ),
          100,
        );
      }

      // Fungsi inisialisasi yang bisa dipanggil berulang kali
      function initNewsTerminal() {
        startClock();
        updateNews("all_symbols");
        updateGauge("OANDA:XAUUSD");
        renderStrength();

        loadWidget(
          "tv-screener",
          "https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js",
          {
            colorTheme: "dark",
            showChart: false,
            locale: "id",
            width: "100%",
            height: "100%",
            isTransparent: true,
            tabs: [
              {
                title: "Forex",
                symbols: [
                  { s: "FX:EURUSD" },
                  { s: "FX:GBPUSD" },
                  { s: "FX:USDJPY" },
                  { s: "OANDA:XAUUSD" },
                ],
              },
              {
                title: "Crypto",
                symbols: [{ s: "BINANCE:BTCUSDT" }, { s: "BINANCE:ETHUSDT" }],
              },
            ],
          },
        );

        loadWidget(
          "tv-mini-calendar",
          "https://s3.tradingview.com/external-embedding/embed-widget-events.js",
          {
            colorTheme: "dark",
            isTransparent: true,
            width: "100%",
            height: "100%",
            locale: "id",
            importanceFilter: "-1,0,1",
          },
        );
      }

      // Jalankan inisialisasi
      if (
        document.readyState === "complete" ||
        document.readyState === "interactive"
      ) {
        initNewsTerminal();
      } else {
        window.addEventListener("DOMContentLoaded", initNewsTerminal);
      }
    </script>
  </body>
</html>
