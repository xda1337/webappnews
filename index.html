<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANSFX | Professional Trading Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }

      /* Custom scrollbar modern */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }

      /* Nav Link Active State */
      .nav-active {
        background-color: #1e293b;
        color: white;
      }
      .nav-active i {
        color: #3b82f6;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-200 overflow-x-hidden">
    <script>
      // Auth Guard sederhana
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }
    </script>

    <nav
      class="fixed bottom-0 w-full bg-slate-900 border-t border-slate-800 flex justify-around p-1 z-50 lg:top-0 lg:left-0 lg:w-64 lg:h-full lg:flex-col lg:justify-start lg:gap-1 lg:border-r lg:border-t-0 lg:p-4"
    >
      <div
        class="hidden lg:flex items-center gap-3 p-4 mb-6 border-b border-slate-800/50"
      >
        <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-900/20">
          <i class="fa fa-chart-line text-white"></i>
        </div>
        <h1 class="text-xl font-black tracking-tighter text-white">
          HANS<span class="text-blue-500">FX</span>
        </h1>
      </div>

      <button
        onclick="loadPage('dashboard')"
        class="nav-link flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-2 lg:px-4 py-3 rounded-xl hover:bg-slate-800 transition-all group"
      >
        <i class="fa fa-th-large text-slate-500 group-hover:text-blue-500"></i>
        <span class="text-[8px] lg:text-xs font-bold uppercase tracking-widest"
          >Dash</span
        >
      </button>

      <button
        onclick="loadPage('news')"
        class="nav-link flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-2 lg:px-4 py-3 rounded-xl hover:bg-slate-800 transition-all group"
      >
        <i class="fa fa-newspaper text-slate-500 group-hover:text-blue-400"></i>
        <span class="text-[8px] lg:text-xs font-bold uppercase tracking-widest"
          >News</span
        >
      </button>

      <button
        onclick="loadPage('entry')"
        class="nav-link flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-2 lg:px-4 py-3 rounded-xl hover:bg-slate-800 transition-all group"
      >
        <i
          class="fa fa-plus-circle text-slate-500 group-hover:text-green-500"
        ></i>
        <span class="text-[8px] lg:text-xs font-bold uppercase tracking-widest"
          >Entry</span
        >
      </button>

      <button
        onclick="loadPage('riwayat')"
        class="nav-link flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-2 lg:px-4 py-3 rounded-xl hover:bg-slate-800 transition-all group"
      >
        <i class="fa fa-history text-slate-500 group-hover:text-purple-500"></i>
        <span class="text-[8px] lg:text-xs font-bold uppercase tracking-widest"
          >History</span
        >
      </button>

      <button
        onclick="loadPage('saldo')"
        class="nav-link flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-2 lg:px-4 py-3 rounded-xl hover:bg-slate-800 transition-all group"
      >
        <i class="fa fa-wallet text-slate-500 group-hover:text-orange-500"></i>
        <span class="text-[8px] lg:text-xs font-bold uppercase tracking-widest"
          >Saldo</span
        >
      </button>

      <button
        onclick="loadPage('profile')"
        class="nav-link flex flex-col lg:flex-row items-center gap-1 lg:gap-3 px-2 lg:px-4 py-3 rounded-xl hover:bg-slate-800 transition-all group"
      >
        <i class="fa fa-user-gear text-slate-500 group-hover:text-blue-400"></i>
        <span class="text-[8px] lg:text-xs font-bold uppercase tracking-widest"
          >Profil</span
        >
      </button>

      <div class="mt-auto hidden lg:block border-t border-slate-800 pt-4">
        <button
          onclick="logout()"
          class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-500/10 w-full rounded-xl transition-all"
        >
          <i class="fa fa-power-off text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-widest"
            >Logout</span
          >
        </button>
      </div>
    </nav>

    <main id="content" class="lg:ml-64 p-4 md:p-8 pb-24 lg:pb-8 min-h-screen">
      <div class="flex items-center justify-center h-full pt-40">
        <div
          class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"
        ></div>
      </div>
    </main>

    <script>
      async function loadPage(page) {
        const contentArea = document.getElementById("content");

        document.querySelectorAll(".nav-link").forEach((btn) => {
          btn.classList.remove("nav-active");
          if (btn.getAttribute("onclick").includes(`'${page}'`)) {
            btn.classList.add("nav-active");
          }
        });

        try {
          const response = await fetch(`${page}.html`);
          if (!response.ok) throw new Error("Halaman tidak ditemukan");

          const html = await response.text();
          contentArea.innerHTML = html;

          const scripts = contentArea.querySelectorAll("script");
          scripts.forEach((oldScript) => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach((attr) =>
              newScript.setAttribute(attr.name, attr.value),
            );
            newScript.text = oldScript.text;
            document.body
              .appendChild(newScript)
              .parentNode.removeChild(newScript);
          });

          document.title = `${page.toUpperCase()} | HansFX`;
          window.scrollTo(0, 0);
        } catch (error) {
          contentArea.innerHTML = `
            <div class="flex flex-col items-center justify-center pt-20 text-center">
              <i class="fa fa-circle-exclamation text-4xl text-red-500 mb-4"></i>
              <h2 class="text-xl font-black text-white uppercase">Gagal Memuat Halaman</h2>
              <p class="text-slate-500 text-sm mt-2">File <b>${page}.html</b> mungkin hilang atau bermasalah.</p>
              <button onclick="loadPage('dashboard')" class="mt-6 px-6 py-2 bg-blue-600 rounded-lg text-xs font-bold uppercase">Kembali ke Dashboard</button>
            </div>
          `;
          console.error(error);
        }
      }

      window.onload = () => {
        loadPage("dashboard");
      };

      function logout() {
        if (confirm("Apakah anda ingin keluar dari sistem?")) {
          sessionStorage.clear();
          window.location.href = "./login.html";
        }
      }
    </script>
  </body>
</html>
