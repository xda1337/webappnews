<script>
  // Logika JS tetap sama untuk fungsionalitas data
  function animateValue(id, start, end, duration, isCurrency = false) {
    const obj = document.getElementById(id);
    if (!obj) return;
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      const val = progress * (end - start) + start;
      if (isCurrency) {
        obj.innerText =
          "$" +
          val.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
      } else {
        obj.innerText =
          Math.floor(val) +
          (id.includes("pct") || id.includes("winrate") ? "%" : "");
      }
      if (progress < 1) window.requestAnimationFrame(step);
    };
    window.requestAnimationFrame(step);
  }

  (function initDashboard() {
    setInterval(() => {
      const el = document.getElementById("server-time");
      if (el) el.innerText = new Date().toLocaleTimeString("en-GB");
    }, 1000);

    const db = getData();
    let tGross = 0,
      tDepo = 0,
      tWD = 0,
      wins = 0,
      losses = 0,
      runningBalance = 0;
    let equityHistory = [];

    const combined = [
      ...(db.trades || []).map((t) => ({ ...t, source: "trade" })),
      ...(db.logs || []).map((l) => ({ ...l, source: "balance" })),
    ].sort((a, b) => new Date(a.date) - new Date(b.date));

    combined.forEach((item) => {
      if (item.source === "trade") {
        const diff =
          item.type === "BUY"
            ? item.close - item.entry
            : item.entry - item.close;
        const net =
          diff * item.lot * 100 +
          (parseFloat(item.swap) || 0) -
          (parseFloat(item.komisi) || 0);
        tGross += net;
        runningBalance += net;
        net >= 0 ? wins++ : losses++;
      } else {
        const amt = parseFloat(item.amount) || 0;
        if (item.type.toUpperCase() === "DEPOSIT") {
          tDepo += amt;
          runningBalance += amt;
        } else {
          tWD += amt;
          runningBalance -= amt;
        }
      }
      equityHistory.push({
        t: new Date(item.date).toLocaleDateString(),
        y: runningBalance,
      });
    });

    const totalTrades = wins + losses;
    const winRate =
      totalTrades > 0 ? Math.round((wins / totalTrades) * 100) : 0;

    animateValue("view-balance", 0, runningBalance, 2000, true);
    animateValue("p-net", 0, tGross, 1500, true);
    animateValue("p-depo", 0, tDepo, 1500, true);
    animateValue("p-wd", 0, tWD, 1500, true);
    animateValue("p-winrate", 0, winRate, 1000);
    animateValue("win-pct-center", 0, winRate, 1500);

    setTimeout(() => {
      const bar = document.getElementById("wr-mini-bar");
      if (bar) bar.style.width = `${winRate}%`;
      const circle = document.getElementById("win-circle");
      if (circle) {
        // Menggunakan keliling lingkaran dinamis
        const r = circle.r.baseVal.valueInSpecifiedUnits;
        const circumference =
          2 * Math.PI * (circle.parentElement.clientWidth * (r / 100));
        circle.style.strokeDasharray = 534; // disesuaikan manual untuk visual stabil
        circle.style.strokeDashoffset = 534 - (534 * winRate) / 100;
      }
      document.getElementById("win-count").innerText = wins;
      document.getElementById("loss-count").innerText = losses;
    }, 500);

    const last4 = [...combined]
      .reverse()
      .filter((x) => x.source === "trade")
      .slice(0, 4);
    document.getElementById("activity-feed").innerHTML = last4
      .map((t) => {
        const diff = t.type === "BUY" ? t.close - t.entry : t.entry - t.close;
        const net =
          diff * t.lot * 100 +
          (parseFloat(t.swap) || 0) -
          (parseFloat(t.komisi) || 0);
        return `
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl shadow-lg">
          <div class="flex justify-between items-start mb-2">
            <span class="text-[8px] font-black text-slate-500 uppercase">${new Date(t.date).toLocaleDateString()}</span>
            <span class="text-[10px] font-bold ${net >= 0 ? "text-green-500" : "text-red-500"}">${t.type}</span>
          </div>
          <p class="text-xs font-black text-white uppercase">${t.pair}</p>
          <div class="flex justify-between items-end mt-2">
            <p class="text-[8px] text-slate-500">${t.lot} LOT</p>
            <p class="text-base font-mono font-black ${net >= 0 ? "text-green-500" : "text-red-500"}">${net >= 0 ? "+" : ""}${net.toFixed(2)}</p>
          </div>
        </div>`;
      })
      .join("");

    renderChart(equityHistory);
  })();

  function renderChart(history) {
    const ctx = document.getElementById("equityChart").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: history.map((h) => h.t),
        datasets: [
          {
            data: history.map((h) => h.y),
            borderColor: "#3b82f6",
            borderWidth: 2,
            tension: 0.4,
            pointRadius: 0,
            fill: true,
            backgroundColor: (context) => {
              const { ctx, chartArea } = context.chart;
              if (!chartArea) return null;
              const gradient = ctx.createLinearGradient(
                0,
                chartArea.bottom,
                0,
                chartArea.top,
              );
              gradient.addColorStop(0, "rgba(59, 130, 246, 0)");
              gradient.addColorStop(1, "rgba(59, 130, 246, 0.2)");
              return gradient;
            },
          },
        ],
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            grid: { color: "rgba(30, 41, 59, 0.5)" },
            ticks: { color: "#475569", font: { size: 9 } },
          },
          x: {
            grid: { display: false },
            ticks: { color: "#475569", font: { size: 9 } },
          },
        },
      },
    });
  }
</script>
