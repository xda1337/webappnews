<script>
  // Fungsi Helper Animasi
  function animateValue(id, start, end, duration, isCurrency = false) {
    const obj = document.getElementById(id);
    if (!obj) return;
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      const val = progress * (end - start) + start;
      obj.innerText = isCurrency
        ? "$" +
          val.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        : Math.floor(val) +
          (id.includes("pct") || id.includes("winrate") ? "%" : "");
      if (progress < 1) window.requestAnimationFrame(step);
    };
    window.requestAnimationFrame(step);
  }

  // --- LOGIKA UTAMA (LOCAL STORAGE) ---
  (function initDashboard() {
    // 1. Clock
    setInterval(() => {
      const el = document.getElementById("server-time");
      if (el) el.innerText = new Date().toLocaleTimeString("en-GB");
    }, 1000);

    // 2. Ambil Data dari db.js (LocalStorage)
    const db = getData();

    let tGross = 0,
      tDepo = 0,
      tWD = 0;
    let wins = 0,
      losses = 0;
    let equityHistory = [];
    let runningBalance = 0;

    // Gabungkan trades dan logs lalu urutkan berdasarkan tanggal
    const combined = [
      ...db.trades.map((t) => ({ ...t, source: "trade" })),
      ...db.logs.map((l) => ({ ...l, source: "balance" })),
    ].sort((a, b) => new Date(a.date) - new Date(b.date));

    combined.forEach((item) => {
      if (item.source === "trade") {
        const diff =
          item.type === "BUY"
            ? item.close - item.entry
            : item.entry - item.close;
        const net =
          diff * item.lot * 100 +
          (parseFloat(item.swap) || 0) -
          (parseFloat(item.komisi) || 0);
        tGross += net;
        runningBalance += net;
        net >= 0 ? wins++ : losses++;
      } else {
        const amt = parseFloat(item.amount) || 0;
        if (item.type.toLowerCase() === "deposit") {
          tDepo += amt;
          runningBalance += amt;
        } else {
          tWD += amt;
          runningBalance -= amt;
        }
      }
      equityHistory.push({
        t: new Date(item.date).toLocaleDateString(),
        y: runningBalance,
      });
    });

    // Kalkulasi Final
    const finalEquity = Math.max(0, runningBalance);
    const totalTrades = wins + losses;
    const winRate =
      totalTrades > 0 ? Math.round((wins / totalTrades) * 100) : 0;
    const growth = tDepo > 0 ? ((tGross / tDepo) * 100).toFixed(1) : 0;

    // Jalankan Animasi Angka
    animateValue("view-balance", 0, finalEquity, 2000, true);
    animateValue("p-net", 0, tGross, 1500, true);
    animateValue("p-depo", 0, tDepo, 1500, true);
    animateValue("p-wd", 0, tWD, 1500, true);
    animateValue("p-winrate", 0, winRate, 1000);
    animateValue("win-pct-center", 0, winRate, 1500);
    animateValue("retention-pct", 0, growth, 2000);

    // Update Bars
    setTimeout(() => {
      document.getElementById("retention-bar").style.width =
        `${Math.min(100, Math.max(0, growth))}%`;
      document.getElementById("wr-mini-bar").style.width = `${winRate}%`;
      document.getElementById("win-circle").style.strokeDashoffset =
        534 - (534 * winRate) / 100;
      document.getElementById("win-count").innerText = wins;
      document.getElementById("loss-count").innerText = losses;
    }, 500);

    // Activity Feed
    const last4 = [...combined]
      .reverse()
      .filter((x) => x.source === "trade")
      .slice(0, 4);
    document.getElementById("activity-feed").innerHTML = last4
      .map((t) => {
        const diff = t.type === "BUY" ? t.close - t.entry : t.entry - t.close;
        const net =
          diff * t.lot * 100 +
          (parseFloat(t.swap) || 0) -
          (parseFloat(t.komisi) || 0);
        return `
          <div class="bg-slate-950 border border-slate-800 p-5 rounded-3xl shadow-lg">
              <div class="flex justify-between items-start mb-2">
                  <span class="text-[8px] font-black text-slate-500 uppercase">${new Date(t.date).toLocaleDateString()}</span>
                  <span class="text-[10px] font-bold ${net >= 0 ? "text-green-500" : "text-red-500"}">${t.type}</span>
              </div>
              <p class="text-sm font-black text-white uppercase">${t.pair}</p>
              <div class="flex justify-between items-end mt-2">
                  <p class="text-[9px] text-slate-500">${t.lot} LOT</p>
                  <p class="text-lg font-mono font-black ${net >= 0 ? "text-green-500" : "text-red-500"}">${net >= 0 ? "+" : ""}${net.toFixed(2)}</p>
              </div>
          </div>`;
      })
      .join("");

    renderChart(equityHistory);
  })();

  function renderChart(history) {
    const ctx = document.getElementById("equityChart").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: history.map((h) => h.t),
        datasets: [
          {
            data: history.map((h) => h.y),
            borderColor: "#2563eb",
            borderWidth: 4,
            tension: 0.4,
            pointRadius: 0,
            fill: true,
            backgroundColor: "rgba(37, 99, 235, 0.1)",
          },
        ],
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: "#1e293b" }, ticks: { color: "#475569" } },
          x: { grid: { display: false }, ticks: { color: "#475569" } },
        },
      },
    });
  }
</script>
