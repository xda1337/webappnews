<div class="space-y-6 pb-32">
  <div
    class="relative bg-slate-900 rounded-3xl border border-slate-800 p-8 overflow-hidden"
  >
    <div
      class="absolute top-0 right-0 w-32 h-32 bg-blue-600/10 rounded-full blur-3xl -mr-16 -mt-16"
    ></div>

    <div class="relative z-10 flex flex-col items-center text-center space-y-4">
      <div class="relative">
        <div
          class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-full flex items-center justify-center text-3xl font-black text-white shadow-2xl border-4 border-slate-900"
        >
          H
        </div>
        <div
          class="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-slate-900 rounded-full"
        ></div>
      </div>

      <div>
        <h2 class="text-xl font-black uppercase tracking-tight text-white">
          HansFX User
        </h2>
        <p
          class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-1"
        >
          Professional Trader ID: #882910
        </p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
      <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">
        Win Rate
      </p>
      <div class="flex items-end gap-2 mt-1">
        <span id="p-win-rate" class="text-lg font-mono font-black text-blue-400"
          >0%</span
        >
        <div class="w-full bg-slate-800 h-1 rounded-full mb-2 overflow-hidden">
          <div
            id="p-win-rate-bar"
            class="bg-blue-500 h-full transition-all duration-1000"
            style="width: 0%"
          ></div>
        </div>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
      <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">
        Total Trades
      </p>
      <span id="p-total-trades" class="text-lg font-mono font-black text-white"
        >0</span
      >
    </div>
  </div>

  <div
    class="bg-slate-900 rounded-2xl border border-slate-800 p-6 space-y-5 shadow-xl"
  >
    <div class="flex items-center gap-2 border-b border-slate-800 pb-3">
      <i class="fa fa-shield-halved text-blue-500 text-xs"></i>
      <h3
        class="text-[10px] font-black uppercase text-slate-300 tracking-widest"
      >
        Account Security
      </h3>
    </div>

    <form
      id="passwordForm"
      class="space-y-4"
      onsubmit="handleUpdatePassword(event)"
    >
      <div class="space-y-1">
        <label class="text-[9px] font-bold text-slate-500 uppercase ml-1"
          >New Master Password</label
        >
        <input
          type="password"
          id="newPassword"
          required
          placeholder="ENTER NEW KEY"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm font-mono text-white focus:outline-none focus:border-blue-500 transition-all placeholder:text-slate-800"
        />
      </div>

      <button
        type="submit"
        id="btnUpdate"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-black uppercase py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-900/20"
      >
        Update Password Now
      </button>
    </form>
  </div>

  <div class="pt-4">
    <button
      onclick="handleLogout()"
      class="w-full py-4 border border-red-900/30 rounded-2xl text-[10px] font-black uppercase text-red-500 hover:bg-red-500/5 transition-all tracking-[0.2em]"
    >
      Logout System
    </button>
  </div>
</div>

<script>
  // Fungsi Update Password Lokal
  function handleUpdatePassword(e) {
    e.preventDefault();
    const newPass = document.getElementById("newPassword").value;
    const btn = document.getElementById("btnUpdate");

    if (!newPass) return;

    btn.innerText = "UPDATING...";
    btn.disabled = true;

    try {
      // Ambil data lama dari LocalStorage (via db.js)
      const db = getData();

      // Update password di objek profile
      db.profile.password = newPass;

      // Simpan kembali (via db.js)
      saveData(db);

      setTimeout(() => {
        alert("Password Berhasil Diperbarui Secara Lokal!");
        document.getElementById("newPassword").value = "";
        btn.innerText = "UPDATE PASSWORD NOW";
        btn.disabled = false;
      }, 500);
    } catch (error) {
      console.error("Error:", error);
      alert("Terjadi kesalahan sistem.");
      btn.disabled = false;
    }
  }

  // Fungsi Logout
  function handleLogout() {
    if (confirm("Apakah anda yakin ingin keluar dari HansFX?")) {
      sessionStorage.clear();
      window.location.href = "./login.html";
    }
  }

  // Load Stats dari LocalStorage
  function loadProfileStats() {
    try {
      const db = getData(); // Panggil fungsi global dari db.js
      const total = db.trades.length;

      document.getElementById("p-total-trades").innerText = total;

      if (total > 0) {
        const wins = db.trades.filter((t) => {
          const diff = t.type === "BUY" ? t.close - t.entry : t.entry - t.close;
          const net =
            diff * t.lot * 100 +
            (parseFloat(t.swap) || 0) -
            (parseFloat(t.komisi) || 0);
          return net >= 0;
        }).length;

        const rate = Math.round((wins / total) * 100);
        document.getElementById("p-win-rate").innerText = `${rate}%`;

        // Animasi bar setelah sedikit delay
        setTimeout(() => {
          document.getElementById("p-win-rate-bar").style.width = `${rate}%`;
        }, 300);
      }
    } catch (e) {
      console.error("Error loading stats:", e);
    }
  }

  // Jalankan load stats saat halaman dimuat
  loadProfileStats();
</script>
