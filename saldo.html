<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<div
  class="space-y-8 pb-32 animate-in fade-in slide-in-from-bottom-6 duration-1000"
>
  <div class="flex justify-between items-center px-2">
    <div>
      <h2
        class="text-3xl md:text-4xl font-black uppercase tracking-tighter text-white italic"
      >
        CASH<span class="text-blue-500">FLOW</span>
      </h2>
      <div class="flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span>
        <p
          class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em]"
        >
          Institutional Grade Security
        </p>
      </div>
    </div>
    <div
      class="h-12 w-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center shadow-lg shadow-blue-500/10"
    >
      <i class="fa-solid fa-vault text-blue-500"></i>
    </div>
  </div>

  <div class="relative group mx-1">
    <div
      class="absolute -inset-1 bg-gradient-to-r from-blue-600 via-indigo-500 to-cyan-400 rounded-[2.5rem] blur-xl opacity-20 group-hover:opacity-40 transition duration-1000"
    ></div>
    <div
      class="relative overflow-hidden bg-slate-950 rounded-[2.2rem] p-6 md:p-8 border border-white/5 shadow-2xl"
    >
      <div
        class="absolute top-0 right-0 w-32 h-32 bg-blue-600/20 rounded-full blur-[60px] -mr-10 -mt-10"
      ></div>
      <div class="relative z-10 space-y-8">
        <div class="flex justify-between items-start">
          <div class="min-w-0 flex-1">
            <p
              class="text-[10px] font-black uppercase tracking-[0.4em] text-slate-500 mb-2"
            >
              Portfolio Valuation
            </p>
            <h3
              id="wallet-balance"
              class="text-3xl md:text-5xl font-mono font-black text-white tracking-tighter tabular-nums truncate"
            >
              $0.00
            </h3>
          </div>
          <div class="flex flex-col items-end ml-4">
            <span
              class="px-3 py-1 bg-green-500/10 border border-green-500/20 rounded-full text-[8px] md:text-[9px] font-black text-green-400 uppercase tracking-widest whitespace-nowrap"
            >
              Live <i class="fa-solid fa-circle text-[6px] ml-1"></i>
            </span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 pt-6 border-t border-white/5">
          <div class="space-y-1 min-w-0">
            <p
              class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"
            >
              Equity Margin
            </p>
            <p
              id="available-margin"
              class="text-base md:text-lg font-mono font-bold text-slate-200 truncate"
            >
              $0.00
            </p>
          </div>
          <div class="space-y-1 text-right">
            <p
              class="text-[9px] font-bold text-slate-500 uppercase tracking-widest"
            >
              Account Tier
            </p>
            <p
              class="text-[10px] md:text-[11px] font-black text-blue-400 uppercase italic tracking-tighter"
            >
              Diamond Protocol
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="bg-slate-900/40 rounded-[2.5rem] border border-slate-800/60 p-6 md:p-8 backdrop-blur-2xl shadow-2xl mx-1"
  >
    <div class="flex flex-col items-center mb-6">
      <span
        class="text-[10px] font-black text-slate-500 uppercase tracking-[0.5em] mb-4"
        >Authorize Transaction</span
      >
      <div class="relative w-full">
        <div
          class="absolute inset-y-0 left-6 flex items-center pointer-events-none"
        >
          <span class="text-xl md:text-2xl font-black text-blue-500/50">$</span>
        </div>
        <input
          type="number"
          id="amount-input"
          placeholder="0.00"
          class="w-full bg-slate-950 border-2 border-slate-800/50 rounded-[1.5rem] py-5 md:py-7 pl-14 pr-8 text-2xl md:text-4xl font-mono font-black text-white focus:outline-none focus:border-blue-600 transition-all placeholder:text-slate-800"
        />
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <button
        onclick="executeTransaction('DEPOSIT')"
        class="group bg-white hover:bg-blue-50 text-slate-950 font-black py-5 md:py-6 rounded-[1.2rem] uppercase text-[11px] md:text-[12px] tracking-widest transition-all active:scale-95 shadow-xl"
      >
        <i class="fa-solid fa-plus-circle mr-2"></i>Deposit
      </button>
      <button
        onclick="executeTransaction('WITHDRAW')"
        class="group bg-slate-800 hover:bg-red-600 text-white font-black py-5 md:py-6 rounded-[1.2rem] uppercase text-[11px] md:text-[12px] tracking-widest transition-all active:scale-95 shadow-xl"
      >
        <i class="fa-solid fa-minus-circle mr-2"></i>Withdraw
      </button>
    </div>
  </div>

  <div class="space-y-5">
    <div class="flex justify-between items-center px-6">
      <h4
        class="text-[10px] font-black uppercase text-slate-500 tracking-[0.3em]"
      >
        Internal Ledger
      </h4>
      <div class="h-[1px] flex-grow mx-4 bg-slate-800"></div>
      <i class="fa-solid fa-list-ul text-slate-600 text-[10px]"></i>
    </div>

    <div id="recent-logs" class="space-y-3 px-1 min-h-[200px]"></div>

    <div
      id="pagination-controls"
      class="flex justify-between items-center px-4 py-4 bg-slate-950/50 rounded-2xl border border-white/5 mx-1"
    >
      <button
        onclick="changeLogPage(-1)"
        id="prevBtn"
        class="px-4 py-2 bg-slate-800 rounded-xl text-[10px] font-black text-white disabled:opacity-20 transition-all"
      >
        <i class="fa-solid fa-chevron-left mr-1"></i> PREV
      </button>
      <span
        id="logPageInfo"
        class="text-[9px] font-black text-slate-500 uppercase tracking-widest"
        >Page 1 of 1</span
      >
      <button
        onclick="changeLogPage(1)"
        id="nextBtn"
        class="px-4 py-2 bg-slate-800 rounded-xl text-[10px] font-black text-white disabled:opacity-20 transition-all"
      >
        NEXT <i class="fa-solid fa-chevron-right ml-1"></i>
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    let currentLogPage = 1;
    const logsPerPage = 5; // Batasan data per halaman
    let totalLogsData = [];

    const StyledAlert = {
      background: "#0f172a",
      color: "#fff",
      confirmButtonColor: "#3b82f6",
      cancelButtonColor: "#1e293b",
      customClass: {
        popup: "rounded-[2rem] border border-slate-800 shadow-2xl",
        title: "text-2xl font-black uppercase",
        htmlContainer: "text-slate-400 font-medium",
      },
    };

    window.syncAndLoadWallet = () => {
      const db = getData();
      let calculatedBalance = 0;

      // Hitung Saldo dari Logs
      if (db.logs) {
        db.logs.forEach((log) => {
          calculatedBalance +=
            log.type === "DEPOSIT"
              ? parseFloat(log.amount)
              : -parseFloat(log.amount);
        });
      }

      // Hitung Saldo dari Trades
      if (db.trades) {
        db.trades.forEach((t) => {
          const pnl =
            (t.type === "BUY" ? t.close - t.entry : t.entry - t.close) *
            t.lot *
            100;
          calculatedBalance +=
            pnl + (parseFloat(t.swap) || 0) - (parseFloat(t.komisi) || 0);
        });
      }

      db.profile.balance = calculatedBalance;
      saveData(db);

      const formatted = calculatedBalance.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      document.getElementById("wallet-balance").innerText = `$${formatted}`;
      document.getElementById("available-margin").innerText = `$${formatted}`;

      totalLogsData = [...(db.logs || [])].reverse();
      renderLogs();
    };

    function renderLogs() {
      const container = document.getElementById("recent-logs");
      if (totalLogsData.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-600 text-[10px] uppercase font-bold py-10 italic">No historical records available</p>`;
        document.getElementById("pagination-controls").classList.add("hidden");
        return;
      }

      document.getElementById("pagination-controls").classList.remove("hidden");

      const totalPages = Math.ceil(totalLogsData.length / logsPerPage);
      if (currentLogPage > totalPages) currentLogPage = totalPages;
      if (currentLogPage < 1) currentLogPage = 1;

      const start = (currentLogPage - 1) * logsPerPage;
      const paginatedLogs = totalLogsData.slice(start, start + logsPerPage);

      container.innerHTML = "";
      paginatedLogs.forEach((log) => {
        const isDepo = log.type === "DEPOSIT";
        const d = new Date(log.date);
        const formattedDate =
          d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) +
          " " +
          d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

        container.innerHTML += `
          <div class="group bg-slate-900/40 border border-slate-800/50 p-5 rounded-[1.8rem] flex justify-between items-center transition-all hover:border-blue-500/30">
            <div class="flex items-center gap-4 min-w-0">
              <div class="w-10 h-10 rounded-2xl flex-shrink-0 ${isDepo ? "bg-green-500/10 text-green-500" : "bg-red-500/10 text-red-500"} flex items-center justify-center">
                <i class="fa-solid ${isDepo ? "fa-arrow-down-long" : "fa-arrow-up-long"}"></i>
              </div>
              <div class="min-w-0">
                <p class="text-[11px] font-black uppercase text-white tracking-widest">${log.type}</p>
                <p class="text-[8px] text-slate-500 font-bold uppercase truncate">${formattedDate}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-base font-mono font-black ${isDepo ? "text-green-400" : "text-red-400"}">
                ${isDepo ? "+" : "-"}$${parseFloat(log.amount).toLocaleString("en-US", { minimumFractionDigits: 2 })}
              </p>
              <p class="text-[8px] text-slate-600 font-black uppercase">Settled</p>
            </div>
          </div>`;
      });

      document.getElementById("logPageInfo").innerText =
        `Page ${currentLogPage} of ${totalPages}`;
      document.getElementById("prevBtn").disabled = currentLogPage === 1;
      document.getElementById("nextBtn").disabled =
        currentLogPage === totalPages;
    }

    window.changeLogPage = (dir) => {
      currentLogPage += dir;
      renderLogs();
    };

    window.executeTransaction = async (type) => {
      const input = document.getElementById("amount-input");
      const amount = parseFloat(input.value);
      if (!amount || amount <= 0)
        return Swal.fire({
          ...StyledAlert,
          icon: "error",
          title: "Invalid Amount",
        });

      const db = getData();
      if (type === "WITHDRAW" && amount > (db.profile.balance || 0)) {
        return Swal.fire({
          ...StyledAlert,
          icon: "error",
          title: "Low Balance",
        });
      }

      const confirm = await Swal.fire({
        ...StyledAlert,
        title: `Confirm ${type}`,
        text: `Authorize $${amount.toLocaleString()} transaction?`,
        showCancelButton: true,
        confirmButtonText: "Authorize",
        icon: "info",
      });

      if (!confirm.isConfirmed) return;

      if (!db.logs) db.logs = [];
      db.logs.push({ type, amount, date: new Date().toISOString() });
      saveData(db);
      input.value = "";

      currentLogPage = 1; // Kembali ke hal 1 untuk melihat transaksi terbaru
      syncAndLoadWallet();
      Swal.fire({
        ...StyledAlert,
        icon: "success",
        title: "Success",
        timer: 1000,
        showConfirmButton: false,
      });
    };

    syncAndLoadWallet();
  })();
</script>
