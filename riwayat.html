<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<div
  class="space-y-8 pb-32 animate-in fade-in slide-in-from-bottom-6 duration-1000"
>
  <div
    class="flex flex-col md:flex-row md:items-end justify-between gap-6 px-2"
  >
    <div>
      <h2
        class="text-3xl font-black uppercase tracking-tighter text-white italic"
      >
        AUDIT <span class="text-blue-500">TRAIL</span>
      </h2>
      <div class="flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span>
        <p
          class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em]"
        >
          Institutional History Ledger
        </p>
      </div>
    </div>

    <div
      class="flex flex-wrap items-center gap-3 bg-slate-900/80 p-2.5 rounded-[1.5rem] border border-white/5 backdrop-blur-xl shadow-2xl"
    >
      <select
        id="rangeFilter"
        onchange="window.toggleCustomDate(this.value)"
        class="bg-slate-950 text-[10px] font-black uppercase px-4 py-3 rounded-xl border border-slate-800 text-blue-400 outline-none focus:border-blue-500 appearance-none cursor-pointer"
      >
        <option value="all">All Records</option>
        <option value="today">Today</option>
        <option value="last_week">7 Days</option>
        <option value="custom">Range</option>
      </select>

      <div id="customDateWrapper" class="hidden flex gap-2 items-center px-2">
        <input
          type="date"
          id="startDate"
          class="bg-slate-950 text-[10px] p-2 rounded-lg border border-slate-800 text-white outline-none"
        />
        <span class="text-slate-600 text-[10px] font-black">/</span>
        <input
          type="date"
          id="endDate"
          class="bg-slate-950 text-[10px] p-2 rounded-lg border border-slate-800 text-white outline-none"
        />
      </div>

      <button
        onclick="
          window.currentPage = 1;
          window.prosesFilterRiwayat();
        "
        class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl text-[10px] font-black uppercase transition-all shadow-lg shadow-blue-900/40 text-white active:scale-95"
      >
        Execute Filter
      </button>
    </div>
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mx-1">
    <div
      class="relative overflow-hidden bg-slate-900 border border-white/5 p-5 md:p-6 rounded-[2rem] group transition-all hover:border-blue-500/30"
    >
      <p
        class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2"
      >
        Net Profit/Loss
      </p>
      <h3
        id="sum-profit"
        class="text-xl md:text-2xl font-mono font-black tabular-nums truncate"
      >
        $0.00
      </h3>
      <div
        class="absolute -right-2 -bottom-2 opacity-[0.03] text-5xl group-hover:scale-110 transition-transform duration-700"
      >
        <i class="fa fa-chart-line"></i>
      </div>
    </div>

    <div
      class="bg-slate-900 border border-white/5 p-5 md:p-6 rounded-[2rem] hover:border-blue-500/30 transition-all"
    >
      <p
        class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2"
      >
        Total Inbound
      </p>
      <h3
        id="sum-depo"
        class="text-xl md:text-2xl font-mono font-black text-blue-400 tabular-nums truncate"
      >
        $0.00
      </h3>
    </div>

    <div
      class="bg-slate-900 border border-white/5 p-5 md:p-6 rounded-[2rem] hover:border-red-500/30 transition-all"
    >
      <p
        class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2"
      >
        Total Outbound
      </p>
      <h3
        id="sum-wd"
        class="text-xl md:text-2xl font-mono font-black text-orange-500 tabular-nums truncate"
      >
        $0.00
      </h3>
    </div>

    <div
      class="relative overflow-hidden bg-blue-600 p-5 md:p-6 rounded-[2rem] shadow-xl shadow-blue-900/30"
    >
      <div
        class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-50"
      ></div>
      <p
        class="relative z-10 text-[9px] font-black text-blue-100 uppercase tracking-widest mb-2"
      >
        Final Balance
      </p>
      <h3
        id="sum-balance"
        class="relative z-10 text-xl md:text-2xl font-mono font-black text-white tabular-nums truncate"
      >
        $0.00
      </h3>
    </div>
  </div>

  <div
    class="bg-slate-950/50 rounded-[2.5rem] border border-white/5 shadow-2xl backdrop-blur-2xl mx-1 overflow-hidden"
  >
    <div class="overflow-x-auto">
      <table class="w-full text-left border-separate border-spacing-0">
        <thead>
          <tr
            class="bg-slate-900/50 text-slate-500 text-[10px] uppercase font-black tracking-[0.2em]"
          >
            <th class="p-6 border-b border-white/5">Order Details</th>
            <th
              class="p-6 border-b border-white/5 text-center hidden md:table-cell"
            >
              Pricing (In/Out)
            </th>
            <th
              class="p-6 border-b border-white/5 text-center hidden lg:table-cell"
            >
              Fees
            </th>
            <th class="p-6 border-b border-white/5 text-right">Settlement</th>
            <th class="p-6 border-b border-white/5 text-center">Action</th>
          </tr>
        </thead>
        <tbody id="history-body" class="font-mono text-slate-300"></tbody>
      </table>
    </div>

    <div
      class="bg-slate-900/80 p-6 flex justify-between items-center border-t border-white/5"
    >
      <button
        onclick="window.changePage(-1)"
        id="btnPrev"
        class="flex items-center gap-3 text-[10px] font-black uppercase px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl disabled:opacity-20 transition-all text-white active:scale-90"
      >
        <i class="fa fa-chevron-left text-[8px]"></i>
        <span class="hidden md:inline">Prev</span>
      </button>
      <span
        id="pageInfo"
        class="text-[9px] md:text-[10px] font-black text-slate-500 uppercase tracking-widest bg-black/40 px-4 py-2.5 rounded-full border border-white/5"
        >Page 1 / 1</span
      >
      <button
        onclick="window.changePage(1)"
        id="btnNext"
        class="flex items-center gap-3 text-[10px] font-black uppercase px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl disabled:opacity-20 transition-all text-white active:scale-90"
      >
        <span class="hidden md:inline">Next</span>
        <i class="fa fa-chevron-right text-[8px]"></i>
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    window.currentPage = 1;
    const rowsPerPage = 7;
    let filteredData = [];

    const AlertStyle = {
      background: "#0a0f1d",
      color: "#fff",
      confirmButtonColor: "#3b82f6",
      cancelButtonColor: "#1e293b",
      customClass: {
        popup: "rounded-[2rem] border border-slate-800 shadow-2xl",
      },
    };

    window.toggleCustomDate = (v) => {
      document
        .getElementById("customDateWrapper")
        .classList.toggle("hidden", v !== "custom");
    };

    window.changePage = (dir) => {
      window.currentPage += dir;
      window.renderTable();
    };

    // Fungsi Toggle Dropdown Mobile
    window.toggleDetail = (id) => {
      const el = document.getElementById(id);
      const icon = document.getElementById("icon-" + id);
      if (el.classList.contains("hidden")) {
        el.classList.remove("hidden");
        if (icon) icon.style.transform = "rotate(180deg)";
      } else {
        el.classList.add("hidden");
        if (icon) icon.style.transform = "rotate(0deg)";
      }
    };

    window.prosesFilterRiwayat = function () {
      const db = getData();
      const range = document.getElementById("rangeFilter").value;
      let tGross = 0,
        tDepo = 0,
        tWD = 0,
        tSwap = 0,
        tKomisi = 0,
        totalCalculatedBalance = 0;

      (db.logs || []).forEach((l) => {
        totalCalculatedBalance +=
          l.type === "DEPOSIT" ? parseFloat(l.amount) : -parseFloat(l.amount);
      });
      (db.trades || []).forEach((t) => {
        const diff = t.type === "BUY" ? t.close - t.entry : t.entry - t.close;
        totalCalculatedBalance +=
          diff * t.lot * 100 +
          (parseFloat(t.swap) || 0) -
          (parseFloat(t.komisi) || 0);
      });

      const combined = [
        ...(db.trades || []).map((t, idx) => ({
          ...t,
          source: "trade",
          originalIdx: idx,
        })),
        ...(db.logs || []).map((l, idx) => ({
          ...l,
          source: "balance",
          originalIdx: idx,
        })),
      ].sort((a, b) => new Date(b.date) - new Date(a.date));

      const isMatch = (dateStr) => {
        const tTime = new Date(dateStr).setHours(0, 0, 0, 0);
        const today = new Date().setHours(0, 0, 0, 0);
        if (range === "all") return true;
        if (range === "today") return tTime === today;
        if (range === "last_week")
          return tTime >= Date.now() - 7 * 24 * 60 * 60 * 1000;
        if (range === "custom") {
          const s = new Date(
            document.getElementById("startDate").value || 0,
          ).setHours(0, 0, 0, 0);
          const e = new Date(
            document.getElementById("endDate").value || Date.now(),
          ).setHours(23, 59, 59, 999);
          return tTime >= s && tTime <= e;
        }
        return true;
      };

      filteredData = combined.filter((item) => {
        const match = isMatch(item.date);
        if (match) {
          if (item.source === "trade") {
            const diff =
              item.type === "BUY"
                ? item.close - item.entry
                : item.entry - item.close;
            tGross += diff * item.lot * 100;
            tSwap += parseFloat(item.swap) || 0;
            tKomisi += parseFloat(item.komisi) || 0;
          } else {
            if (item.type === "DEPOSIT") tDepo += parseFloat(item.amount);
            else tWD += parseFloat(item.amount);
          }
        }
        return match;
      });

      const displayProfit = tGross + tSwap - tKomisi;
      const profEl = document.getElementById("sum-profit");
      profEl.innerText = `${displayProfit >= 0 ? "+" : ""}$${displayProfit.toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
      profEl.className = `text-xl md:text-2xl font-mono font-black tabular-nums truncate ${displayProfit >= 0 ? "text-green-400" : "text-red-500"}`;
      document.getElementById("sum-depo").innerText =
        "$" + tDepo.toLocaleString("en-US", { minimumFractionDigits: 2 });
      document.getElementById("sum-wd").innerText =
        "-$" + tWD.toLocaleString("en-US", { minimumFractionDigits: 2 });
      document.getElementById("sum-balance").innerText =
        "$" +
        totalCalculatedBalance.toLocaleString("en-US", {
          minimumFractionDigits: 2,
        });

      window.renderTable();
    };

    window.renderTable = () => {
      const body = document.getElementById("history-body");
      body.innerHTML = "";
      const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
      const start = (window.currentPage - 1) * rowsPerPage;
      const paginatedItems = filteredData.slice(start, start + rowsPerPage);

      paginatedItems.forEach((item, i) => {
        const d = new Date(item.date).toLocaleString("id-ID", {
          day: "2-digit",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
        const rowId = `detail-${i}`;

        if (item.source === "trade") {
          const diff =
            item.type === "BUY"
              ? item.close - item.entry
              : item.entry - item.close;
          const net =
            diff * item.lot * 100 +
            (parseFloat(item.swap) || 0) -
            (parseFloat(item.komisi) || 0);

          body.innerHTML += `
            <tr onclick="window.toggleDetail('${rowId}')" class="hover:bg-white/[0.02] cursor-pointer transition-colors border-b border-white/5">
              <td class="p-4 md:p-6">
                <div class="flex items-center gap-3">
                  <div class="w-1 h-8 ${item.type === "BUY" ? "bg-green-500" : "bg-red-500"} rounded-full"></div>
                  <div>
                    <p class="text-white font-black text-xs md:text-sm uppercase flex items-center gap-2">
                      ${item.pair} <i id="icon-${rowId}" class="fa fa-chevron-down text-[8px] text-slate-600 md:hidden transition-transform"></i>
                    </p>
                    <p class="text-[9px] text-slate-500 font-bold mt-1">${d} • <span class="${item.type === "BUY" ? "text-green-500" : "text-red-500"}">${item.type}</span></p>
                  </div>
                </div>
              </td>
              <td class="p-6 text-center hidden md:table-cell">
                <div class="inline-block text-left">
                  <p class="text-[10px] text-slate-400 font-bold">IN: ${item.entry.toFixed(5)}</p>
                  <p class="text-[10px] text-blue-400 font-bold">OUT: ${item.close.toFixed(5)}</p>
                </div>
              </td>
              <td class="p-6 text-center hidden lg:table-cell">
                <p class="text-[9px] text-slate-500 uppercase font-black">Swap: <span class="text-slate-300">${item.swap}</span></p>
                <p class="text-[9px] text-slate-500 uppercase font-black">Fee: <span class="text-slate-300">-${item.komisi}</span></p>
              </td>
              <td class="p-4 md:p-6 text-right">
                <p class="font-black text-xs md:text-sm ${net >= 0 ? "text-green-400" : "text-red-500"}">${net >= 0 ? "+" : ""}${net.toFixed(2)}</p>
                <p class="text-[8px] text-slate-600 font-black uppercase">Settled</p>
              </td>
              <td class="p-4 md:p-6 text-center">
                <button onclick="event.stopPropagation(); window.hapusItem('trade', ${item.originalIdx})" class="w-8 h-8 rounded-xl bg-slate-900 border border-white/5 hover:bg-red-500 text-slate-500 hover:text-white transition-all">
                  <i class="fa fa-trash-alt text-[10px]"></i>
                </button>
              </td>
            </tr>
            <tr id="${rowId}" class="hidden md:hidden bg-slate-900/50 border-b border-white/5">
              <td colspan="5" class="p-5">
                <div class="grid grid-cols-2 gap-4">
                  <div class="space-y-1">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Entry Price</p>
                    <p class="text-xs font-bold text-white">${item.entry.toFixed(5)}</p>
                  </div>
                  <div class="space-y-1">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Exit Price</p>
                    <p class="text-xs font-bold text-blue-400">${item.close.toFixed(5)}</p>
                  </div>
                  <div class="space-y-1">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Swap / Rollover</p>
                    <p class="text-xs font-bold ${item.swap >= 0 ? "text-green-500" : "text-red-500"}">${item.swap}</p>
                  </div>
                  <div class="space-y-1">
                    <p class="text-[8px] font-black text-slate-500 uppercase">Broker Commission</p>
                    <p class="text-xs font-bold text-slate-300">-${item.komisi}</p>
                  </div>
                </div>
              </td>
            </tr>`;
        } else {
          const isDepo = item.type === "DEPOSIT";
          body.innerHTML += `
            <tr class="bg-blue-500/[0.03] border-b border-white/5">
              <td class="p-4 md:p-6">
                <div class="flex items-center gap-3">
                  <div class="w-1 h-8 ${isDepo ? "bg-blue-500" : "bg-orange-500"} rounded-full"></div>
                  <div>
                    <p class="text-blue-400 font-black text-xs md:text-sm uppercase italic">CASH ${item.type}</p>
                    <p class="text-[9px] text-slate-500 font-bold mt-1">${d}</p>
                  </div>
                </div>
              </td>
              <td class="p-6 text-center hidden md:table-cell text-[9px] text-slate-600 font-black uppercase italic">Capital Adjustment</td>
              <td class="p-6 text-center hidden lg:table-cell text-[9px] text-slate-600 font-black">---</td>
              <td class="p-4 md:p-6 text-right">
                <p class="font-black text-xs md:text-sm ${isDepo ? "text-blue-400" : "text-orange-400"}">
                  ${isDepo ? "+" : "-"}${parseFloat(item.amount).toFixed(2)}
                </p>
                <p class="text-[8px] text-slate-600 font-black uppercase">Balance Flux</p>
              </td>
              <td class="p-4 md:p-6 text-center">
                <button onclick="window.hapusItem('balance', ${item.originalIdx})" class="w-8 h-8 rounded-xl bg-slate-900 border border-white/5 hover:bg-red-500 text-slate-500 hover:text-white transition-all">
                  <i class="fa fa-trash-alt text-[10px]"></i>
                </button>
              </td>
            </tr>`;
        }
      });

      document.getElementById("pageInfo").innerText =
        `Page ${window.currentPage} / ${totalPages}`;
      document.getElementById("btnPrev").disabled = window.currentPage === 1;
      document.getElementById("btnNext").disabled =
        window.currentPage === totalPages || totalPages === 0;
    };

    window.hapusItem = (type, originalIdx) => {
      Swal.fire({
        ...AlertStyle,
        title: "Delete Record?",
        text: "This action will permanently adjust your portfolio valuation.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Confirm Delete",
      }).then((result) => {
        if (result.isConfirmed) {
          const db = getData();
          if (type === "trade") db.trades.splice(originalIdx, 1);
          else db.logs.splice(originalIdx, 1);
          saveData(db);
          window.prosesFilterRiwayat();
        }
      });
    };

    window.prosesFilterRiwayat();
  })();
</script>
